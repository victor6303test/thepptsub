<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:site_name" content="thepptsub">
    <meta property="og:type" content="website">
    <meta property="og:title" content="thepptsub">
    <title>PPT 演出字幕產生器</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script language="javascript" src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.3.1/dist/pptxgen.bundle.js"></script>
    
    <style>
        body {
            font-family: "微軟正黑體", sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .main-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .left-panel, .right-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .toggle-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 16px;
        }
        textarea {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
        }
        /* 預覽區塊的比例與縮放 */
        .preview-wrapper {
            width: calc(100% - 4px);  /* 扣掉左右 2px 虛線框 */
            max-width: 480px;
            aspect-ratio: 16 / 9;     /* 寬度跟著螢幕縮放，高度自動維持 16:9 */
            box-sizing: content-box;  /* 16:9 算在框線內側，模擬投影片才不會被裁到 */
            border: 2px dashed #888; 
            background-color: #fff;
            overflow: hidden; 
            margin: 10px 0;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        /* 模擬 16:9 投影片真實大小 (960x540) */
        #previewSlide {
            width: 960px; 
            height: 540px; 
            transform: scale(0.5);  /* 實際倍率由 fitPreview() 依預覽框寬度計算 */
            transform-origin: top left; 
            position: relative; 
            box-sizing: border-box;
        }
        #previewTextBox {
            position: absolute; 
            text-align: center; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.2;
            /* 匯出的 PPT 沒指定字型，會用佈景主題字型：英數 Calibri Light、中文 新細明體 */
            font-family: "Calibri Light", "PMingLiU", "新細明體", serif;
            /* PowerPoint 文字框預設內邊距：上下 0.05 吋、左右 0.1 吋 (1 吋 = 96px) */
            padding: 4.8px 9.6px;
        }
        /* 文字包一層，直書時才不會被 flex 壓扁、超出高度時也會正確換行 */
        #previewTextBox .ptxt {
            max-width: 100%;
            max-height: 100%;
        }
        .controls-box {
            background-color: #eee;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        .controls-row {
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }
        .btn-group button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #aaa;
            background-color: #fff;
            transition: 0.2s;
        }
        .btn-group button:hover {
            background-color: #ddd;
        }
        .refT{
            padding: 5px 5px;
            border-radius: 5px;
            color:#ffffff;
            background-color: #ff0000;
        }
        
        /* 多頁預覽控制區 */
        .pagination-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .pagination-controls button {
            padding: 5px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #aaa;
            background-color: #fff;
        }
        .pagination-controls button:disabled {
            background-color: #eee;
            color: #aaa;
            cursor: not-allowed;
        }
        .pagination-controls span {
            font-weight: bold;
            font-size: 15px;
            color: #333;
        }
        .hint-text {
            font-weight: bold;
            font-size: 14px;
            text-align: left;
            background-color: #ffeeba;
            padding: 10px;
            border-radius: 5px;
            color: #856404;
            margin-top: 10px;
            line-height: 1.5;
        }

        /* ================= RWD ================= */
        *, *::before, *::after { box-sizing: border-box; }
        .left-panel, .right-panel {
            flex: 1 1 0;
            min-width: 0;          /* 讓內容可以縮，不會把版面撐爆 */
            max-width: 520px;
        }
        textarea {
            width: 100%;
            max-width: 100%;
            min-height: 200px;
            line-height: 1.5;
        }
        .hint-text { width: 100%; }
        .toggle-row { width: 100%; }
        .toggle-row button { flex: 1 1 0; max-width: 200px; font-size: 15px; }
        .controls-row { flex-wrap: wrap; gap: 10px 20px; }
        .controls-row label { white-space: nowrap; }
        .refT { margin-bottom: 10px; text-align: center; }
        .btn-group button { margin: 5px 0; min-height: 44px; }
        @media (hover: none) {
            .btn-group button:hover { background-color: #fff; } /* 觸控裝置不留 hover 灰底 */
        }

        /* 平板直向與手機：改成上下排列 */
        @media (max-width: 900px) {
            body { padding: 12px; }
            h2 { font-size: 22px; margin: 4px 0 12px; }
            .main-container { flex-direction: column; align-items: center; gap: 20px; }
            .left-panel, .right-panel { width: 100%; max-width: 600px; flex: none; }
            .preview-wrapper { max-width: none; }
            textarea { height: 40vh; }
        }

        /* 手機 */
        @media (max-width: 480px) {
            body { padding: 8px; }
            h2 { font-size: 20px; }
            .hint-text { font-size: 13px; }
            .controls-box { padding: 10px; }
            .controls-row { flex-direction: column; align-items: stretch; gap: 8px; }
            .controls-row label {
                display: flex; align-items: center;
                white-space: normal; gap: 6px;
            }
            /* 輸入框和後面的 % 一起靠右 */
            .controls-row label input, .controls-row label select { margin-left: auto; }
            .controls-row select { flex: 1; min-width: 0; max-width: 220px; }
            .pagination-controls { gap: 8px; }
            .pagination-controls button { padding: 8px 12px; min-height: 40px; }
            .toggle-row { gap: 10px; }
        }
    </style>

    <script>
        var txt1;
        var subslide;
        var cc = "關";
        var sy = "\n";
        var currentPreviewIndex = 0;
        var totalSlides = 1;

        function getFontSize() {
            var size = parseInt($("#fontSizeInput").val());
            return isNaN(size) ? 30 : size;
        }
        function getXPos() {
            var x = parseFloat($("#xPosInput").val());
            return isNaN(x) ? 0 : x;
        }
        function getYPos() {
            var y = parseFloat($("#yPosInput").val());
            return isNaN(y) ? 0 : y;
        }

        function applyDefaultPositions() {
            var mode = $("#previewMode").val();
            if (mode === "SPPT") {
                $("#xPosInput").val(0);
                $("#yPosInput").val(4.5); 
            } else if (mode === "LHPPT") {
                $("#xPosInput").val(0);
                $("#yPosInput").val(36.7);
            } else if (mode === "LSPPT") {
                $("#xPosInput").val(40);
                $("#yPosInput").val(0);
            }
            updatePreview();
        }

        function CustomS(){
            if(cc == "開"){
                cc="關";
                sy = "\n";
                $("#CC").text(cc);
                $("#CC").css("color","blue");
                $("#CCB").css("background-color","goldenrod");
            }
            else{
                cc = "開";
                sy = "\n\n";
                $("#CC").text(cc);
                $("#CC").css("color","red");
                $("#CCB").css("background-color","#ffe169");
            }
            updatePreview();
        }

        function prevSlide() {
            if (currentPreviewIndex > 0) {
                currentPreviewIndex--;
                renderPreviewSlide();
            }
        }

        function nextSlide() {
            if (currentPreviewIndex < totalSlides - 1) {
                currentPreviewIndex++;
                renderPreviewSlide();
            }
        }

        function updatePreview() {
            var text = $("#addsub").val();
            var txts = text.split(sy);
            totalSlides = txts.length;

            if (currentPreviewIndex >= totalSlides) {
                currentPreviewIndex = totalSlides - 1;
            }
            if (currentPreviewIndex < 0) {
                currentPreviewIndex = 0;
            }
            renderPreviewSlide();
        }

        function renderPreviewSlide() {
            var text = $("#addsub").val();
            var txts = text.split(sy);
            var mode = $("#previewMode").val();
            
            var fSize = getFontSize();
            var xPos = getXPos() + "%";
            var yPos = getYPos() + "%";

            $("#pageIndicator").text(`第 ${currentPreviewIndex + 1} / ${totalSlides} 頁`);
            $("#btnPrev").prop("disabled", currentPreviewIndex === 0);
            $("#btnNext").prop("disabled", currentPreviewIndex >= totalSlides - 1);

            var currentText = txts[currentPreviewIndex] ? txts[currentPreviewIndex].replace(/\n/g, '<br>') : "";
            var $previewBox =$("#previewTextBox");
            var $previewSlide =$("#previewSlide");

            $previewBox.html('<div class="ptxt">' + currentText + '</div>');$previewBox.css("font-size", (fSize * 96 / 72) + "px"); // PPT 字級是 pt，1pt = 1.333px

            $previewBox.css({
                "top": "", "left": "", "width": "", "height": "", 
                "background-color": "", "color": "", "writing-mode": "", "padding": ""
            });

            if (mode === "SPPT") {
                $previewSlide.css("background-color", "#92D050");
                $previewBox.css({
                    "background-color": "#000000", "color": "#FFFFFF",
                    "left": xPos, "top": yPos, "width": "100%", "height": "144px",
                    "writing-mode": "horizontal-tb"
                });
            } else if (mode === "LHPPT") {
                $previewSlide.css("background-color", "#000000");
                $previewBox.css({
                    "background-color": "#000000", "color": "#FFFFFF",
                    "left": xPos, "top": yPos, "width": "100%", "height": "144px",
                    "writing-mode": "horizontal-tb"
                });
            } else if (mode === "LSPPT") {
                $previewSlide.css("background-color", "#000000");
                $previewBox.css({
                    "background-color": "#000000", "color": "#FFFFFF",
                    "left": xPos, "top": yPos, "width": "192px", "height": "100%",
                    "writing-mode": "vertical-rl",
                    "padding": "9.6px 4.8px" // 直書時內邊距跟著文字方向轉 90 度
                });
            }
        }

        /* ================= 逗號自動換行 ================= */
        // 全形「，」與半形「,」都會被移除並換成換行（逗號後面原本若已有換行，不會多出空行）
        var COMMA_RE = /[ \t]*[,，][ \t]*(\r?\n)?/g;
        var isComposing = false; // 中文輸入法選字中，先不要動內容，否則會打斷選字
        var commaMode = false;   // 逗號自動換行功能，預設關閉

        function toggleCommaMode() {
            commaMode = !commaMode;
            $("#CM").text(commaMode ? "開" : "關").css("color", commaMode ? "red" : "blue");
            $("#CMB").css("background-color", commaMode ? "#ffe169" : "goldenrod");
            if (commaMode) {
                replaceCommas(); // 打開時，把已經輸入的逗號也一起處理
                updatePreview();
            }
            $("#addsub").focus(); // 按完按鈕直接回到輸入框繼續打字
        }

        function replaceCommas() {
            if (!commaMode) return;
            var el = document.getElementById("addsub");
            var val = el.value;
            COMMA_RE.lastIndex = 0;
            if (!COMMA_RE.test(val)) return;

            // 依游標前的文字計算新游標位置，讓游標停在換行之後
            var caret = el.selectionStart;
            var before = val.slice(0, caret).replace(COMMA_RE, "\n");
            var after = val.slice(caret).replace(COMMA_RE, "\n");
            el.value = before + after;
            el.setSelectionRange(before.length, before.length);
        }

        // 依預覽框目前的寬度，把 960x540 的模擬投影片等比例縮放進去
        function fitPreview() {
            var wrapper = document.querySelector(".preview-wrapper");
            if (!wrapper) return;
            var scale = wrapper.clientWidth / 960;
            document.getElementById("previewSlide").style.transform = "scale(" + scale + ")";
        }

        $(document).ready(function() {
            fitPreview();
            if (window.ResizeObserver) {
                new ResizeObserver(fitPreview).observe(document.querySelector(".preview-wrapper"));
            } else {
                $(window).on("resize orientationchange", fitPreview);
            }
            // 要先綁這個，才會在 updatePreview 之前把逗號換掉
            $("#addsub")
                .on("compositionstart", function () { isComposing = true; })
                .on("compositionend", function () {
                    isComposing = false;
                    replaceCommas();
                    updatePreview();
                })
                .on("input", function () {
                    if (!isComposing) replaceCommas();
                });

            $("#addsub, #fontSizeInput, #xPosInput, #yPosInput").on("input", updatePreview);
            $("#previewMode").on("change", applyDefaultPositions);
            applyDefaultPositions(); 
        });

        /* ================= 採用 Slide Master (投影片母片) 的匯出邏輯 ================= */
        function generatePPT() {
            var pptx = new PptxGenJS();
            var fSize = getFontSize();
            var xPos = getXPos() + "%";
            var yPos = getYPos() + "%";
            var mode = $("#previewMode").val();
            
            var text = document.getElementById('addsub').value;
            var txts = text.split(sy);
            
            var bgFill = (mode === "SPPT") ? "92D050" : "000000";
            var masterName = "MASTER_" + mode;
            
            var placeholderOpts = {
                name: "title",       
                type: "title",
                x: xPos, 
                y: yPos, 
                align: 'center', 
                valign: 'middle',
                fontSize: fSize, 
                color: 'FFFFFF',    
                fill: { color: '000000' }
            };

            // 依據直式或橫式設定長寬與文字方向
            if (mode === "SPPT" || mode === "LHPPT") {
                placeholderOpts.w = '100%';
                placeholderOpts.h = 1.5;
            } else if (mode === "LSPPT") {
                placeholderOpts.w = 2.0;
                placeholderOpts.h = '100%';
                placeholderOpts.vert = 'eaVert';
            }
            
            // 【關鍵修改】：把 text 從單純文字，改成帶有 font size 屬性的陣列
            // 這樣 PowerPoint 才會乖乖把母片裡的「這段預覽文字」也放大！
            pptx.defineSlideMaster({
                title: masterName,
                background: { fill: bgFill },
                objects: [
                    { 
                        placeholder: { 
                            options: placeholderOpts,
                            text: [
                                {
                                    text: '【請反白(全選)此文字來修改格式】',
                                    //options: { fontSize: fSize, color: 'FFFFFF' }
                                }
                            ]
                        } 
                    }
                ]
            });
            
            // 產出每一頁投影片，並將文字套用至標題佔位符中
            for (var i = 0; i < txts.length; i++) {
                var slide = pptx.addSlide({ masterName: masterName });
                slide.addText(txts[i], { placeholder: "title" });
            }
            
            var filename = "PptxGenJs-Export-" + mode + ".pptx";

            // 【母片預覽修正】pptxgenjs 會把字級寫死在母片預覽文字的每個字上 (rPr sz)，
            // 這種「字元直接格式」會蓋過母片版面配置的樣式 (lstStyle)，
            // 所以在母片裡改字級時，樣式其實改了 (投影片重設後會套用)，但預覽文字看起來不變。
            // 解法：匯出後打開 pptx (zip)，把版面配置裡文字的直接格式移除，只保留 lstStyle。
            pptx.write("blob")
                .then(function (blob) { return JSZip.loadAsync(blob); })
                .then(function (zip) {
                    // 直式模式要把 vert="eaVert" 補進母片文字框；三種模式都補上垂直置中
                    var bodyAttrs = ' anchor="ctr"' + (mode === "LSPPT" ? ' vert="eaVert"' : '');
                    return Promise.all([fixMasterPreview(zip, bodyAttrs), fixSlideFill(zip)]).then(function () {
                        return zip.generateAsync({
                            type: "blob",
                            mimeType: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
                        });
                    });
                })
                .then(function (blob) { downloadBlob(blob, filename); })
                .catch(function (err) {
                    console.error(err);
                    alert("匯出失敗：" + err);
                });
        }

        // pptxgenjs 會在每張投影片的字幕框寫上 <a:noFill/>（無填滿），
        // 這會蓋掉母片設定的黑底，所以把它拿掉，讓投影片沿用母片的填滿顏色
        function fixSlideFill(zip) {
            var names = Object.keys(zip.files).filter(function (n) {
                return /^ppt\/slides\/slide\d+\.xml$/.test(n);
            });
            return Promise.all(names.map(function (name) {
                return zip.file(name).async("string").then(function (xml) {
                    xml = xml.replace(/<p:sp>[\s\S]*?<\/p:sp>/g, function (sp) {
                        if (sp.indexOf("<p:ph") === -1) return sp; // 只處理佔位符
                        return sp.replace(/(<p:spPr>[\s\S]*?)<a:noFill\/>([\s\S]*?<\/p:spPr>)/, "$1$2");
                    });
                    zip.file(name, xml);
                });
            }));
        }

        // 移除 slideLayout 內文字的直接格式，讓預覽文字跟著母片樣式 (lstStyle) 走
        function fixMasterPreview(zip, bodyAttrs) {
            var names = Object.keys(zip.files).filter(function (n) {
                return /^ppt\/slideLayouts\/slideLayout\d+\.xml$/.test(n);
            });
            return Promise.all(names.map(function (name) {
                return zip.file(name).async("string").then(function (xml) {
                    xml = xml
                        .replace(/<a:rPr\b[^>]*?(\/>|>[\s\S]*?<\/a:rPr>)/g, '<a:rPr lang="zh-TW" dirty="0"/>')
                        .replace(/(<a:endParaRPr\b[^>]*?)\s+sz="\d+"/g, "$1");
                    // pptxgenjs 3.3.1 不會把 placeholder 的 vert / valign 寫進母片，這裡手動補上
                    if (bodyAttrs) {
                        xml = xml.replace(/<a:bodyPr\b(?![^>]*\bvert=)([^>]*?)(\/?)>/g, function (m, attrs, selfClose) {
                            return '<a:bodyPr' + attrs + bodyAttrs + selfClose + '>';
                        });
                    }
                    zip.file(name, xml);
                });
            }));
        }

        function downloadBlob(blob, filename) {
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }
    </script>
</head>
<body>
    <h2>PPT 演出字幕產生器</h2>
    
    <div class="main-container">
        <!-- 左側：輸入區域 -->
        <div class="left-panel">
            <textarea id="addsub" cols="60" rows="22" placeholder="請在此輸入字幕......"></textarea>
            
            <div class="hint-text">
                💡 <b>母片修改秘訣 (必看)：</b><br>
                1. 匯出後，在 PPT 開啟 <b>檢視 -> 投影片母片</b>。<br>
                2. <b>滑鼠游標點進去把字「全部反白(全選)」</b>，再去調整字體大小，預覽就會同步變更。<br>
                3. 關閉母片回到普通畫面後，在左側縮圖區 <b>全選 (Ctrl+A)</b> 所有投影片。<br>
                4. 點擊上方工具列 <b>常用 ->「重設」(新投影片右邊的按鈕)</b>，所有字幕就會瞬間套用母片設定！
            </div>

            <br>
            <div class="toggle-row">
                <button id="CCB" style="background-color:goldenrod; font-weight:bold; padding:10px; border-radius:8px; border:none; cursor:pointer;" onclick="CustomS()">
                    自訂分頁模式<br>(一頁多行)
                    <p id="CC" style="color:blue; font-size:18px; margin: 5px 0 0 0;">關</p>
                </button>
                <button id="CMB" style="background-color:goldenrod; font-weight:bold; padding:10px; border-radius:8px; border:none; cursor:pointer;" onclick="toggleCommaMode()">
                    逗號自動換行<br>(，與 , 皆可)
                    <p id="CM" style="color:blue; font-size:18px; margin: 5px 0 0 0;">關</p>
                </button>
            </div>
        </div>

        <!-- 右側：設定與預覽區域 -->
        <div class="right-panel">
            <!-- 設定控制區 -->
            <div class="controls-box">
                <div class="controls-row">
                    <label style="font-weight: bold;">
                        模擬預覽情境：
                        <select id="previewMode" style="padding:4px; font-size:16px;">
                            <option value="SPPT">直播字幕 (白字黑底綠頁)</option>
                            <option value="LHPPT">現場字幕 (白字全黑橫式)</option>
                            <option value="LSPPT">現場字幕 (白字全黑直式)</option>
                        </select>
                    </label>
                    <label style="font-weight: bold;">
                        字體大小：
                        <input type="number" id="fontSizeInput" value="30" min="10" max="150" style="width:60px; padding:3px; font-size:16px;">
                    </label>
                </div>
                <div class="controls-row" style="margin-bottom: 0;">
                    <label style="font-weight: bold;">
                        水平位置 (X)：
                        <input type="number" id="xPosInput" value="0" step="0.1" style="width:70px; padding:3px; font-size:16px;"> %
                    </label>
                    <label style="font-weight: bold;">
                        垂直位置 (Y)：
                        <input type="number" id="yPosInput" value="4.5" step="0.1" style="width:70px; padding:3px; font-size:16px;"> %
                    </label>
                </div>
                <div style="font-size:12px; color:#666; margin-top:5px;">(切換情境會自動帶入預設座標，可自由微調)</div>
            </div>
            
            <!-- 即時預覽畫面 -->
            <div style="margin-top: 15px; font-weight:bold; color:#555;">(投影片匯出預覽)</div>
            <div class="preview-wrapper">
                <div id="previewSlide">
                    <div id="previewTextBox"></div>
                </div>
            </div>

            <!-- 多頁預覽控制區 -->
            <div class="pagination-controls">
                <button id="btnPrev" onclick="prevSlide()">◀ 上一頁</button>
                <span id="pageIndicator">第 1 / 1 頁</span>
                <button id="btnNext" onclick="nextSlide()">下一頁 ▶</button>
            </div>
            <div class="refT">
                僅參考，請至PowerPoint進行細微調整
            </div>

            <!-- 匯出按鈕區 -->
            <div class="btn-group" style="display:flex; flex-direction:column; gap:10px; width:100%;">
                <button onclick="generatePPT()">⬇ 產生並下載 PPTX</button>
            </div>
        </div>
    </div>
</body>
</html>
